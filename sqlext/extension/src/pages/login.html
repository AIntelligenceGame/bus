<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>登录 · SQL 结构化解析</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap center">
  <h1>登录</h1>

    <div class="msg" id="msg"></div>
  </div>

  <div class="tabs">
    <a href="login.html" class="on">登录</a>

  </div>

</html>
